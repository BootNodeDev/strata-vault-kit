# Checked in CI by `cargo deny --locked check`. Exact pins mean a flagged
# dependency waits for the next milestone's upgrade; each ignore says why.

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained, not vulnerable; it is a build-time macro that soroban-env-host and soroban-env-common bring in through the pinned soroban-sdk" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 comes in through soroban-env-host's elliptic-curve crates, which run only in host-side tests and are not in the contract Wasm; no soroban-env-host release uses the fixed 0.7.6 yet (checked 2026-10-26)" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
