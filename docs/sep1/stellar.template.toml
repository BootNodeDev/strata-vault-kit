# SEP-1 asset metadata (stellar.toml) for the share token.
# Placeholders look like "<NAME>"; regenerate with
# `npm run sep1 -w scripts/harness` once the vault is deployed.

VERSION = "2.7.0"
NETWORK_PASSPHRASE = "<NETWORK_PASSPHRASE>"

[DOCUMENTATION]
ORG_NAME = "<ORG_NAME>"
ORG_URL = "<ORG_URL>"
ORG_LOGO = "<ORG_LOGO>"
ORG_DESCRIPTION = "<ORG_DESCRIPTION>"
ORG_OFFICIAL_EMAIL = "<ORG_OFFICIAL_EMAIL>"
ORG_SUPPORT_EMAIL = "<ORG_SUPPORT_EMAIL>"

[[CURRENCIES]]
code = "<code>"
contract = "<contract>"
status = "<status>"
display_decimals = "<display_decimals>"
name = "<name>"
desc = "<desc>"
image = "<image>"
is_asset_anchored = true
anchor_asset_type = "<anchor_asset_type>"
anchor_asset = "<anchor_asset>"
attestation_of_reserve = "<attestation_of_reserve>"
redemption_instructions = "<redemption_instructions>"
