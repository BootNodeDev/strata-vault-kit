[workspace]

[package]
name = "upgrade-target"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = "=26.1.1"
stellar-contract-utils = "=0.7.2"

[profile.release]
opt-level       = "z"
overflow-checks = true
lto             = true
codegen-units   = 1
panic           = "abort"
strip           = "symbols"
