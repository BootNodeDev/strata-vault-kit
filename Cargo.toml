[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[profile.release]
opt-level       = "z"
overflow-checks = true
lto             = true
codegen-units   = 1
panic           = "abort"
strip           = "symbols"

[workspace.dependencies]
soroban-sdk = "=26.1.1"
stellar-tokens = "=0.7.2"
stellar-access = "=0.7.2"
stellar-macros = "=0.7.2"
stellar-contract-utils = "=0.7.2"
