name: Build Project and Run Tests

on:
  push:
    branches: ["main", "feedback"]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A cancelled push run would leave a failed build check on that commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  PKG_CONFIG_PATH: /usr/lib/pkgconfig
  PUBLIC_STELLAR_NETWORK: local

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The test merge commit and its parents, to diff a pull request against its base.
          fetch-depth: 2
      - name: Check whether anything besides docs changed
        id: filter
        run: |
          code=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            CHANGED=$(git diff --no-renames --name-only HEAD^1 HEAD)
            printf '%s\n' "$CHANGED"
            code=false
            while IFS= read -r path; do
              case "$path" in
                "") ;;
                # The harness hashes the sample valuation.
                docs/evidence/*) code=true ;;
                *.md) ;;
                *) code=true ;;
              esac
            done <<< "$CHANGED"
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm i -g npm@11.7.0
      - run: npm --version
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test

  rust-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # A cached CLI would outlive a version bump in the install steps.
          cache-bin: "false"
          workspaces: |
            . -> target
            fixtures/upgrade-target -> target
      # Before the CLI install so a broken contract test fails without
      # waiting on it. rustup picks the toolchain from rust-toolchain.toml.
      - name: Run the contract unit tests
        run: cargo test --locked
      - run:
          sudo apt-get update && sudo apt-get install -y libudev-dev
          libdbus-1-dev pkg-config
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa # v1.21.1
      - name: Install stellar CLI
        run: |
          if ! command -v stellar &> /dev/null; then
            cargo binstall --locked stellar-cli@27.0.0
          fi
      # The upgrade tests run built Wasm, so they need the fixture, both
      # contracts and their probe builds first (docs/TESTING.md).
      - name: Run the Wasm upgrade tests
        run: |
          # Setting pipefail so a failing test run is not hidden by `tee`
          set -o pipefail
          stellar contract build --manifest-path fixtures/upgrade-target/Cargo.toml
          stellar contract build --package share-token
          stellar contract build --package nav-oracle
          CARGO_TARGET_DIR=target/upgrade-probe stellar contract build --package share-token --features upgrade_probe
          CARGO_TARGET_DIR=target/upgrade-probe stellar contract build --package nav-oracle --features upgrade_probe
          SOROBAN_SDK_BUILD_SYSTEM_SUPPORTS_SPEC_SHAKING_V2=1 cargo test --locked -p async-vault -p nav-oracle --features upgrade_wasm with_wasm 2>&1 | tee upgrade-tests.log
          scripts/ci/check-tests-ran.sh upgrade-tests.log test::upgrade::with_wasm test_governance::with_wasm

  network:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # In the background, so the steps up to "Wait for the local network" run while it boots.
      - name: Start Stellar local network
        env:
          # Pinned by digest: "latest" moves with every protocol build.
          IMAGE: docker.io/stellar/quickstart:v687-b1580.1-latest@sha256:7711899e9942c60316ebacf8ab901be15bed7a5a31705d847b55375ff3bc8356
          # The image's own default can be a protocol its RPC cannot simulate.
          PROTOCOL_VERSION: "30"
        # The exit file lets the wait step fail at once when the pull or start fails.
        run: |
          (
            trap '' HUP
            status=0
            docker run -d --name stellar -p 8000:8000 \
              -e ENABLE_LOGS=true -e ENABLE=core,rpc -e NETWORK=local \
              -e PROTOCOL_VERSION="$PROTOCOL_VERSION" "$IMAGE" || status=$?
            echo "$status" > "$RUNNER_TEMP/quickstart.exit"
          ) > "$RUNNER_TEMP/quickstart.log" 2>&1 &

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm i -g npm@11.7.0
      - run: npm --version
      - run: npm ci
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # A cached CLI would outlive a version bump in the install steps.
          cache-bin: "false"
      - run:
          sudo apt-get update && sudo apt-get install -y libudev-dev
          libdbus-1-dev pkg-config
      # binstall fetches a prebuilt stellar-scaffold-cli instead of compiling it
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa # v1.21.1
      - name: Install stellar-scaffold
        run: |
          if ! command -v stellar-scaffold &> /dev/null; then
            echo "stellar-scaffold not found, installing..."
            # --locked so the source-build fallback uses the CLI's published
            # Cargo.lock instead of resolving fresh soroban deps whose MSRV
            # may outrun the pinned toolchain.
            cargo binstall --locked stellar-scaffold-cli@0.0.27
          else
            echo "stellar-scaffold already installed. Clear cache to force reinstall."
          fi
      - name: Install stellar CLI
        run: |
          if ! command -v stellar &> /dev/null; then
            cargo binstall --locked stellar-cli@27.0.0
          fi
      # The same cargo build Scaffold runs, so its build below reuses the Wasm.
      - name: Build the contracts
        run: stellar contract build
      - name: Build the vault without the wind-down minimum
        run:
          CARGO_TARGET_DIR=target/short-wind-down stellar contract build
          --package async-vault --features short_wind_down
      - name: Read the Playwright version
        id: playwright
        run: |
          VERSION=$(jq -r '.packages["node_modules/playwright-core"].version' package-lock.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key:
            ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Install Playwright's system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: e2e

      - name: Wait for the local network
        timeout-minutes: 12
        run: |
          fail() {
            echo "$1"
            cat "$RUNNER_TEMP/quickstart.log"
            docker logs stellar || true
            exit 1
          }
          while [ "$SECONDS" -lt 600 ]; do
            EXIT=$(cat "$RUNNER_TEMP/quickstart.exit" 2>/dev/null || true)
            if [ -n "$EXIT" ] && [ "$EXIT" != 0 ]; then
              fail "docker run failed with exit code $EXIT."
            fi
            case "$(docker inspect -f '{{.State.Status}}' stellar 2>/dev/null || true)" in
              exited | dead) fail "The local network container stopped." ;;
            esac
            if curl --no-progress-meter --max-time 5 -X POST -H 'Content-Type: application/json' \
                -d '{"jsonrpc": "2.0", "id": 1, "method": "getHealth"}' \
                http://localhost:8000/rpc 2>/dev/null | grep -q healthy &&
              curl --no-progress-meter --max-time 5 http://localhost:8000/friendbot 2>/dev/null |
                grep -q '"invalid_field": "addr"'; then
              exit 0
            fi
            sleep 2
          done
          fail "The local network did not start in 10 minutes."
      - name: Add master account as default identity
        run: |
          mkdir -p .config/stellar/identity
          echo 'secret_key = "SC5O7VZUXDJ6JBDSZ74DSERXL7W3Y5LTOAMRF7RQRL3TAGAPS7LUVG3L"' > .config/stellar/identity/me.toml
      - name: Build with Scaffold and build client packages
        run: |
          # Setting pipefail so a failed build's exit status isn't overwritten
          # by a successful call of `tee`
          set -o pipefail
          STELLAR_SCAFFOLD_ENV=development stellar-scaffold build \
            --build-clients 2>&1 | tee build_clients.log
          # Build the clients against the workspace @stellar/stellar-sdk, not the scaffold's copy.
          rm -rf app-lib/clients/*/node_modules
      - name: Check client generation summary
        run: |
          # Extract the number after "Failed: "
          FAILED=$(grep -Eo "Failed: [0-9]+" build_clients.log | awk '{print $2}')
          if [ -z "$FAILED" ]; then
            # Only reachable when the build exited 0, so a missing summary line
            # means nothing failed rather than that the generator died early.
            echo "Could not find 'Failed: N' in build_clients.log, all clients succeeded."
            exit 0
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo "Client generation summary check failed: Failed: $FAILED"
            echo "Check the \"Build with Scaffold\" step logs."
            exit 1
          fi
      # Assert that client generation worked by checking the actual build
      # artifacts rather than relying on exit status, which could still be 0
      # even if nothing was built.
      - name: Check generated clients
        run: |
          INDEX=app-lib/clients/index.ts
          if [ ! -s "$INDEX" ]; then
            echo "Expected $INDEX to exist and be non-empty after client generation."
            exit 1
          fi
          # Count one exported const per contract
          EXPECTED=$(find contracts -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          ACTUAL=$(grep -c "^export const " "$INDEX" || true)
          if [ "$ACTUAL" -ne "$EXPECTED" ]; then
            echo "Expected $EXPECTED client(s) in $INDEX, found $ACTUAL."
            echo "Partial client generation, check the \"Build with Scaffold\" step."
            grep "^export const " "$INDEX" || echo "(no exports)"
            exit 1
          fi
          echo "Generated $ACTUAL client(s)."
      - name:
          Deploy the native asset contract and register it as the alias asset
        # The console is written against a Stellar Asset Contract, so the
        # development build needs one. Its id is deterministic, so a rerun only
        # re-registers the alias.
        run: |
          RPC=http://localhost:8000/rpc
          PASSPHRASE="Standalone Network ; February 2017"
          ID=$(stellar contract id asset --asset native --rpc-url "$RPC" --network-passphrase "$PASSPHRASE")
          if ! stellar contract invoke --id "$ID" --source me --rpc-url "$RPC" --network-passphrase "$PASSPHRASE" -- name > /dev/null 2>&1; then
            stellar contract asset deploy --asset native --source me --rpc-url "$RPC" --network-passphrase "$PASSPHRASE"
          fi
          stellar contract alias add asset --id "$ID" --rpc-url "$RPC" --network-passphrase "$PASSPHRASE"
      - name: Build the workspaces against the contracts deployed above
        run: npm run build --workspaces --if-present
        env:
          ADDRESSES_ENV: development
      - name: Run smoke tests
        run: npx playwright test
        working-directory: e2e
      - name: Deploy the vault set to the local network
        run: npm run deploy -w scripts/harness
        env:
          HARNESS_NETWORK: local
      - name: Typecheck the harness workspace
        run: npm run typecheck -w scripts/harness
      - name: Run the vault happy path on the local network
        run: npm run test:happy-path -w scripts/harness
        env:
          HARNESS_NETWORK: local
      - name: Run the vault guards on the local network
        run: npm run test:guards -w scripts/harness
        env:
          HARNESS_NETWORK: local
      - name: Run a wind-down on a throwaway vault on the local network
        run: npm run test:wind-down -w scripts/harness
        env:
          HARNESS_NETWORK: local
      - name: Keep the harness report when it fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harness-runs
          path: scripts/harness/runs/
          if-no-files-found: ignore

  rust-checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: "false"
      # rustup reads rust-toolchain.toml, which includes clippy and rustfmt.
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint with warnings as errors
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Check licences, advisories, bans and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # Replaces the action's default --all-features, so CI runs the
          # same command as docs/TESTING.md.
          arguments: --locked
          command: check

  # The check branch protection requires; Rust and network may skip only for docs.
  build:
    if: always()
    needs: [changes, js, rust-tests, network]
    runs-on: ubuntu-latest
    steps:
      - name: Check the results
        env:
          CODE: ${{ needs.changes.outputs.code }}
          CHANGES: ${{ needs.changes.result }}
          JS: ${{ needs.js.result }}
          RUST_TESTS: ${{ needs.rust-tests.result }}
          NETWORK: ${{ needs.network.result }}
        run: |
          echo "changes=$CHANGES js=$JS rust-tests=$RUST_TESTS network=$NETWORK code=$CODE"
          [ "$CHANGES" = success ] && [ "$JS" = success ] || exit 1
          if [ "$CODE" = true ]; then
            [ "$RUST_TESTS" = success ] && [ "$NETWORK" = success ] || exit 1
          fi
