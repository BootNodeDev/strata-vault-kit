### Development environment configuration
[development.network]
rpc-url = "http://localhost:8000/rpc"
network-passphrase = "Standalone Network ; February 2017"
run-locally = true # automatically start the local network container, if not already running

[[development.accounts]]
name = "me" # Required. Keys for this account will be saved to `./.stellar/identity`
default = true # Optional. Whether to use this account as the `--source` for commands that need one.

# No contracts yet — the vault crate lands in #20. Declare it here once it exists,
# or `stellar scaffold` will try to build and deploy something that isn't there.
#
# Keys, for when that happens:
#   client = true      build the crate, deploy it, and generate its TS client into
#                      app-lib/clients. Requires the crate to be a member of the
#                      local Cargo workspace, and the key here to be the
#                      underscored form of its Cargo.toml `name`.
#   constructor_args   arguments to `__constructor`, as passed after `--` to
#                      `stellar contract deploy`.
#   after_deploy       `stellar contract invoke` calls to run once deployed; each
#                      line is only the part after the `--`.
#
# `constructor_args` and `after_deploy` work in `development` and `testing` only.
[development.contracts]

### Staging environment configuration
[staging.network]
rpc-url = "https://soroban-testnet.stellar.org"
network-passphrase = "Test SDF Network ; September 2015"

[[staging.accounts]]
name = "testnet-user"
default = true

# Deployed contract addresses go here as `name = { id = "C..." }`. The deploy
# script (#15) is what emits them.
[staging.contracts]

