### Development environment configuration
[development.network]
rpc-url = "http://localhost:8000/rpc"
network-passphrase = "Standalone Network ; February 2017"
run-locally = true # automatically start the local network container, if not already running

[[development.accounts]]
name = "me" # Required. Keys for this account will be saved to `./.stellar/identity`
default = true # Optional. Whether to use this account as the `--source` for commands that need one.

# Keys:
#   client = true      build the crate, deploy it, and generate its TS client into
#                      app-lib/clients. Requires the crate to be a member of the
#                      local Cargo workspace, and the key here to be the
#                      underscored form of its Cargo.toml `name`.
#   constructor_args   arguments to `__constructor`, passed after `--` to
#                      `stellar contract deploy`. Account and contract names here
#                      resolve to their deployed addresses.
#   after_deploy       `stellar contract invoke` calls to run once deployed; each
#                      line is only the part after the `--`.
#
# `constructor_args` and `after_deploy` work in `development` and `testing` only.
[development.contracts]

[development.contracts.compliance]
client = true
constructor_args = "--admin me"

[development.contracts.identity_verifier]
client = true
constructor_args = "--admin me"

[development.contracts.share_token]
client = true
constructor_args = '--name "Strata Vault USDC" --symbol bvUSDC --admin me --compliance_authority me --compliance compliance --identity_verifier identity_verifier'

# `--config` takes the OracleConfig struct as JSON. The values mirror the
# contract's own tests: a one-hour freshness window, a one-minute cooldown, a
# 10% deviation cap and a 0.5–100 band at the 18-decimal scale. The two i128
# fields are strings because they do not survive a JSON number round trip.
[development.contracts.nav_oracle]
client = true
constructor_args = "--admin me --attester me --guardian me --config '{\"freshness_duration\":3600,\"cooldown_secs\":60,\"max_up_bps\":1000,\"max_down_bps\":10000,\"min_answer\":\"500000000000000000\",\"max_answer\":\"100000000000000000000\"}'"

[development.contracts.async_vault]
client = true
constructor_args = '--asset share_token --share_token share_token --oracle nav_oracle --roles "{\"attester\":\"me\",\"compliance\":\"compliance\",\"governance\":\"me\",\"guardian\":\"me\",\"manager\":\"me\",\"treasury\":\"share_token\"}"'
# Two grants are missing here on purpose, because this file cannot express them.
# `after_deploy` lines are appended to `stellar contract invoke --id <this
# contract> --`, so a line can only call the contract whose block it sits in.
# The vault needs the share token's manager role and needs allowlisting on the
# identity verifier, and both target other contracts while requiring the vault's
# own address, which only exists after it deploys last. The deploy in
# scripts/harness performs and verifies both.
#
# Setup cannot finish from this file either. The vault's `finish_setup` checks
# the token and oracle bindings, the manager role, the allowlist and the
# compliance binding, which only the harness deploy wires, and that the token
# has no shares outstanding. A deploy made only from this file leaves the
# token's, the oracle's and the vault's setup open, so its vault refuses
# deposits with `SetupOpen`. The harness deploy closes all three.


### Staging environment configuration
[staging.network]
rpc-url = "https://soroban-testnet.stellar.org"
network-passphrase = "Test SDF Network ; September 2015"

[[staging.accounts]]
name = "testnet-user"
default = true

# Deployed contract addresses go here as `name = { id = "C..." }`. The deploy
# in scripts/harness is what emits them.
#
# `client` defaults to true, so none of these repeat it. `asset` is the
# underlying Stellar Asset Contract and has no crate here; it still gets a
# generated client, because a SAC carries its own spec.
[staging.contracts]
async_vault = { id = "CD5LYYXGOJ7R23P6D7YUN6DUJQYMI23KEUEOIFKXOSWOX3KHKTXRITED" }
nav_oracle = { id = "CBKVMUMIX7MXYHX5K34N5HYZOP6S2VGWF7MN27RIWBV3A3WD3X3L63CO" }
share_token = { id = "CDOISQTQRCYOTH6S3DFQ6UKJ2TEXLNO7NFIGOZS4RZL63IRCVXXCGP5N" }
identity_verifier = { id = "CCTCCY7AVFAIRGEWWJZT2UDMBHS3NGNKVUWLY43CHDNN75AQEV6P3EOY" }
