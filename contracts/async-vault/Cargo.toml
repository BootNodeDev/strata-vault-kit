[package]
name = "async-vault"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
strata-storage = { path = "../../crates/strata-storage" }
stellar-access = { workspace = true }
stellar-macros = { workspace = true }
stellar-contract-utils = { workspace = true }
stellar-tokens = { workspace = true }
strata-bindings = { path = "../../crates/strata-bindings" }
strata-timelock = { path = "../../crates/strata-timelock" }


[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
nav-oracle = { path = "../nav-oracle" }
share-token = { path = "../share-token" }
compliance = { path = "../compliance" }
identity-verifier = { path = "../identity-verifier" }
proptest = "=1.11.0"

[features]
upgrade_wasm = []
# Builds a stand-in for a later vault version, used only by the upgrade tests.
upgrade_probe = []
# Drops the wind-down minimum to zero for the local harness. Never deployed.
short_wind_down = []
