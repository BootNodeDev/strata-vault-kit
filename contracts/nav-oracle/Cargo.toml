[package]
name = "nav-oracle"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
strata-storage = { path = "../../crates/strata-storage" }
stellar-access = { workspace = true }
stellar-macros = { workspace = true }
strata-bindings = { path = "../../crates/strata-bindings" }
strata-timelock = { path = "../../crates/strata-timelock" }
stellar-contract-utils = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
# Builds a stand-in for a later oracle version, used only by the upgrade test.
upgrade_probe = []
# Runs the test that upgrades the built oracle to its probe build. Build both first.
upgrade_wasm = []
