[package]
name = "identity-verifier"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
stellar-access = { workspace = true }
stellar-macros = { workspace = true }
stellar-tokens = { workspace = true }
strata-bindings = { path = "../../crates/strata-bindings" }
strata-storage = { path = "../../crates/strata-storage" }
strata-timelock = { path = "../../crates/strata-timelock" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
claim-issuer = { path = "../claim-issuer" }
claim-topics = { path = "../claim-topics" }
identity-registry = { path = "../identity-registry" }
investor-identity = { path = "../investor-identity" }
ed25519-dalek = "=2.2.0"
